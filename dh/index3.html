<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalaguAoeu · 个人导航</title>
<style>
  :root{
    --bg:#f6f4ef; --bg-soft:#efece3; --card:#fdfcf9;
    --ink:#211d17; --muted:#77705f; --faint:#a59d8a;
    --border:#e3ddcd; --border-strong:#cec6b1;
    --accent:#c2452d; --accent-soft:#f3e0da;
    --mark:#f5e3b8;
    --fx-rgb:151,166,190;
    --shadow:0 1px 2px rgba(40,32,16,.05), 0 8px 24px -12px rgba(40,32,16,.18);
    --font-body:"Avenir Next","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --font-display:"Palatino Linotype",Palatino,"Songti SC","STSong","SimSun",Georgia,serif;
    --font-mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
    --t-teal-bg:#dcece8; --t-teal-ink:#0f6e60;
    --t-rose-bg:#f7e3e6; --t-rose-ink:#b23f52;
    --t-amber-bg:#f5ebd3; --t-amber-ink:#9c6b0d;
    --t-blue-bg:#e2eaf6; --t-blue-ink:#2f62a8;
    --t-violet-bg:#e9e5f6; --t-violet-ink:#5f4bb8;
    --t-pink-bg:#f7e3ec; --t-pink-ink:#b13e77;
  }
  [data-theme="dark"]{
    --bg:#151310; --bg-soft:#1b1814; --card:#201d17;
    --ink:#ece7da; --muted:#9a927e; --faint:#6e6753;
    --border:#2c2920; --border-strong:#3d382a;
    --accent:#e2785c; --accent-soft:#3a2a22;
    --mark:#4d4322;
    --fx-rgb:226,231,240;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.55);
    --t-teal-bg:#143532; --t-teal-ink:#5ec4b3;
    --t-rose-bg:#3a1f24; --t-rose-ink:#ef93a3;
    --t-amber-bg:#372c12; --t-amber-ink:#e5b45c;
    --t-blue-bg:#1a2a3d; --t-blue-ink:#7fa9e8;
    --t-violet-bg:#261f3a; --t-violet-ink:#a794e8;
    --t-pink-bg:#381f2b; --t-pink-ink:#e593bd;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    transition:background .35s ease, color .35s ease;
  }

  /* ---------- 顶栏（含搜索行，整体吸顶） ---------- */
  .topwrap{
    position:sticky; top:0; z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(1.2) blur(10px);
    border-bottom:1px solid var(--border);
  }
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 28px 0;
  }
  .brand{display:flex; align-items:center; gap:11px; flex-shrink:0;}
  .brand .mark{
    width:36px; height:36px; border-radius:9px;
    background:var(--ink); color:var(--bg);
    display:grid; place-items:center;
    font-family:var(--font-display); font-size:19px; font-weight:700;
  }
  .brand-name{line-height:1.15;}
  .brand-name b{
    display:block; font-family:var(--font-display);
    font-size:17px; font-weight:700; letter-spacing:.04em;
  }
  .brand-name span{
    display:block; font-size:10.5px; letter-spacing:.22em;
    color:var(--faint); text-transform:uppercase; font-family:var(--font-mono);
  }

  /* ---------- 搜索行（顶栏下方居中） ---------- */
  .searchbar{
    display:flex; justify-content:center;
    padding:14px 28px 10px;
  }

  /* ---------- 天气行（搜索栏下方居中） ---------- */
  .wxbar{
    display:flex; justify-content:center;
    padding:0 28px 14px;
    overflow:hidden; line-height:0;
  }
  .wxbar iframe{
    border:none; width:400px; height:34px; display:block;
    transform:scale(.92); transform-origin:center top;
  }

  .search{
    width:100%; max-width:660px; position:relative;
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:5px;
    transition:border-color .2s, box-shadow .2s;
  }
  .search:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .engines{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex-shrink:0;}
  .engines::-webkit-scrollbar{display:none;}
  .engine{
    font:inherit; font-size:13px; cursor:pointer;
    border:0; background:transparent; color:var(--muted);
    padding:8px 11px; border-radius:8px; white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .engine:hover{color:var(--ink);}
  .engine.on{background:var(--ink); color:var(--bg); font-weight:600;}
  .search input{
    flex:1; min-width:110px; font:inherit; font-size:14px;
    color:var(--ink); background:transparent;
    border:0; outline:none; padding:0 10px;
  }
  .search input::placeholder{color:var(--faint);}
  .search-btn{
    flex-shrink:0; font:inherit; font-size:13.5px; cursor:pointer;
    background:var(--accent); color:#fff; border:1px solid var(--accent);
    border-radius:9px; padding:8px 18px; white-space:nowrap;
    transition:filter .15s ease;
  }
  .search-btn:hover{filter:brightness(1.08);}

  .actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .cal-wrap{position:relative;}
  .clock{
    font-family:var(--font-mono); font-size:12.5px; color:var(--muted);
    padding-right:6px; white-space:nowrap; cursor:pointer;
    border-radius:8px; transition:color .15s ease;
  }
  .clock:hover{color:var(--accent);}

  /* ---------- 日历面板 ---------- */
  .cal-panel{
    position:absolute; right:0; top:calc(100% + 10px);
    width:264px;
    background:var(--card); border:1px solid var(--border-strong); border-radius:12px;
    box-shadow:var(--shadow); padding:13px 14px 10px; z-index:40;
  }
  .cal-panel[hidden]{display:none;}
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .cal-title{
    font-family:var(--font-display); font-size:14.5px; font-weight:700;
    letter-spacing:.03em;
  }
  .cal-nav{display:flex; gap:4px;}
  .cal-nav button, .cal-today{
    font:inherit; font-size:12px; cursor:pointer;
    border:1px solid var(--border); border-radius:7px;
    background:var(--bg-soft); color:var(--muted);
    padding:3px 9px; line-height:1.4;
    transition:all .15s ease;
  }
  .cal-nav button{padding:3px 8px;}
  .cal-nav button:hover, .cal-today:hover{color:var(--accent); border-color:var(--accent);}
  .cal{width:100%; border-collapse:collapse; table-layout:fixed;}
  .cal th{
    font-size:10.5px; font-weight:500; color:var(--faint);
    letter-spacing:.06em; padding:2px 0 6px;
  }
  .cal th.we{color:var(--accent); opacity:.75;}
  .cal td{text-align:center; padding:1px;}
  .cal td span{
    display:grid; place-items:center;
    width:28px; height:28px; border-radius:8px;
    font-size:12.5px; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .cal td.we span{color:var(--accent);}
  .cal td.dim span{color:var(--faint); opacity:.5;}
  .cal td.today span{
    background:var(--accent); color:#fff; font-weight:700;
  }
  .cal-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; padding-top:8px;
    border-top:1px solid var(--border);
    font-size:11.5px; color:var(--muted);
  }
  .cal-ext{
    font-size:11.5px; color:var(--muted); text-decoration:none;
    border:1px solid var(--border); border-radius:6px; padding:2px 8px;
    transition:all .15s ease; white-space:nowrap;
  }
  .cal-ext:hover{color:var(--accent); border-color:var(--accent);}
  .btn{
    font:inherit; font-size:13.5px; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:9px;
    background:var(--card); color:var(--ink);
    padding:8px 14px; transition:all .18s ease;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:focus-visible, .card:focus-visible, .chip:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .search input:focus-visible{outline:none;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{color:#fff; filter:brightness(1.08);}
  .btn.icon{padding:8px 10px; font-size:15px;}

  /* ---------- 主体 ---------- */
  main{max-width:1180px; margin:0 auto; padding:26px 28px 8px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
  .chip{
    font:inherit; font-size:13px; cursor:pointer;
    border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--muted);
    padding:6px 14px; transition:all .18s ease;
    display:inline-flex; align-items:center; gap:7px;
  }
  .chip:hover{border-color:var(--border-strong); color:var(--ink);}
  .chip.on{
    background:var(--ink); border-color:var(--ink); color:var(--bg);
  }
  .chip .n{
    font-family:var(--font-mono); font-size:11px; opacity:.65;
  }

  section{margin-bottom:34px; animation:rise .4s ease both;}
  section h2{
    font-family:var(--font-display); font-size:15px; font-weight:700;
    letter-spacing:.08em; color:var(--muted);
    display:flex; align-items:center; gap:10px; margin-bottom:13px;
  }
  section h2::before{
    content:""; width:9px; height:9px; border-radius:2.5px;
    background:var(--hue-dot, var(--accent));
  }
  section h2 .count{
    font-family:var(--font-mono); font-size:11px; color:var(--faint); font-weight:400;
  }

  .grid{
    display:grid; gap:11px;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  }
  .card{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--border); border-radius:11px;
    padding:13px 14px; text-decoration:none; color:inherit;
    position:relative; overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation:rise .4s ease both;
    animation-delay:calc(var(--i, 0) * 22ms);
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
    border-color:var(--border-strong);
  }
  .card::after{
    display:none;
  }

  .mono{
    width:42px; height:42px; border-radius:10px; flex-shrink:0;
    display:grid; place-items:center;
    font-family:var(--font-display); font-size:19px; font-weight:700;
  }
  .mono.teal{background:var(--t-teal-bg); color:var(--t-teal-ink);}
  .mono.rose{background:var(--t-rose-bg); color:var(--t-rose-ink);}
  .mono.amber{background:var(--t-amber-bg); color:var(--t-amber-ink);}
  .mono.blue{background:var(--t-blue-bg); color:var(--t-blue-ink);}
  .mono.violet{background:var(--t-violet-bg); color:var(--t-violet-ink);}
  .mono.pink{background:var(--t-pink-bg); color:var(--t-pink-ink);}

  .card-body{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .card-name{
    font-size:14.5px; font-weight:600; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-desc{
    font-size:12px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-url{
    font-family:var(--font-mono); font-size:10.5px; color:var(--faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px;}

  .del{
    border:0; background:none; color:var(--faint); cursor:pointer;
    font-size:15px; line-height:1; padding:6px; border-radius:6px;
    opacity:0; transition:all .15s ease; flex-shrink:0;
  }
  .card:hover .del{opacity:.7;}
  .del:hover{color:var(--accent); opacity:1 !important;}

  .empty{
    text-align:center; padding:70px 20px; color:var(--faint);
  }
  .empty b{
    display:block; font-family:var(--font-display); font-size:20px;
    color:var(--muted); margin-bottom:10px;
  }
  .empty span{font-size:13.5px;}

  .stats{
    max-width:1180px; margin:0 auto;
    padding:18px 28px 34px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--faint);
    border-top:1px solid var(--border);
  }
  .stats .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block;margin:0 8px;vertical-align:middle;}

  /* ---------- 底部（友情链接 + 版权，样式沿用 index.html 并适配主题） ---------- */
  .footer{max-width:1180px; margin:0 auto; padding:6px 28px 30px;}
  .footer .link{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px; padding:16px 20px;
  }
  .footer .linktop{
    font-size:13.5px; color:var(--ink); font-weight:600;
    padding-bottom:10px; border-bottom:1px solid var(--border);
  }
  .footer .flinks{display:flex; flex-wrap:wrap; gap:6px 22px; padding-top:12px;}
  .footer .flinks a{font-size:13px; color:var(--muted); text-decoration:none; transition:color .15s ease;}
  .footer .flinks a:hover{color:var(--accent);}
  .footer .flinks .none{font-size:12.5px; color:var(--faint);}
  .footer p{text-align:center;color:var(--faint);font-size:12px;margin-top:14px;line-height:1.8;}
  .footer p a{color:var(--muted);text-decoration:none;}
  .footer p a:hover{color:var(--accent);}

  /* ---------- 弹窗 ---------- */
  dialog{
    border:1px solid var(--border-strong); border-radius:14px;
    background:var(--bg); color:var(--ink);
    padding:0; width:min(440px, calc(100vw - 40px));
    box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(15,12,8,.45); backdrop-filter:blur(2px);}
  .modal-head{
    padding:18px 22px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h3{
    font-family:var(--font-display); font-size:17px; font-weight:700;
  }
  .modal-head .x{
    border:0; background:none; font-size:18px; cursor:pointer;
    color:var(--faint); padding:4px 8px; border-radius:6px;
  }
  .modal-head .x:hover{color:var(--accent);}
  .modal-body{padding:16px 22px 22px; display:grid; gap:13px;}
  .field label{
    display:block; font-size:12px; color:var(--muted);
    margin-bottom:5px; letter-spacing:.03em;
  }
  .field input, .field select{
    width:100%; font:inherit; font-size:14px;
    color:var(--ink); background:var(--card);
    border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .newcat{display:none;}
  .newcat.show{display:block;}
  .modal-foot{
    display:flex; justify-content:flex-end; gap:9px; margin-top:4px;
  }

  /* ---------- 外观配色面板 ---------- */
  html{color-scheme:light;}
  .ap-wrap{position:relative;}
  .ap-panel{
    position:absolute; right:0; top:calc(100% + 8px);
    width:272px; max-width:calc(100vw - 28px);
    background:var(--card); border:1px solid var(--border-strong); border-radius:12px;
    box-shadow:var(--shadow); padding:14px; z-index:40;
    display:grid; gap:9px;
  }
  .ap-panel[hidden]{display:none;}
  .ap-seg{display:flex; gap:6px;}
  .ap-seg .seg{
    flex:1; font:inherit; font-size:12.5px; cursor:pointer;
    border:1px solid var(--border); border-radius:8px;
    background:var(--bg-soft); color:var(--muted);
    padding:7px 4px; transition:all .15s ease; white-space:nowrap;
  }
  .ap-seg .seg:hover{color:var(--ink); border-color:var(--border-strong);}
  .ap-seg .seg.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .ap-title{font-size:11px; color:var(--faint); letter-spacing:.08em; margin-top:2px;}
  .ap-preset{
    display:flex; align-items:center; gap:9px; padding:6px 8px;
    border:1px solid transparent; border-radius:9px; cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .ap-preset:hover{background:var(--bg-soft);}
  .ap-preset.on{border-color:var(--border-strong); background:var(--bg-soft);}
  .ap-swatch{
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    background:var(--dot); border:1px solid rgba(0,0,0,.18);
  }
  .ap-name{font-size:13px; color:var(--ink); flex:1;}
  .ap-acc{
    width:26px; height:26px; padding:0; flex-shrink:0;
    border:1px solid var(--border); border-radius:7px;
    background:none; cursor:pointer;
  }
  .ap-acc::-webkit-color-swatch-wrapper{padding:2px;}
  .ap-acc::-webkit-color-swatch{border:none; border-radius:4px;}
  .ap-bg{display:flex; align-items:center; gap:9px; padding:2px 8px;}
  .ap-hint{font-size:12px; color:var(--muted); flex:1;}
  .ap-reset{
    font:inherit; font-size:12.5px; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:8px;
    background:var(--bg-soft); color:var(--muted);
    padding:7px 10px; transition:all .15s ease;
  }
  .ap-reset:hover{color:var(--accent); border-color:var(--accent);}

  /* ---------- toast ---------- */
  .toast{
    position:fixed; bottom:28px; left:50%;
    transform:translate(-50%, 12px);
    background:var(--ink); color:var(--bg);
    font-size:13px; padding:9px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .25s ease;
    z-index:50; box-shadow:var(--shadow);
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  /* ---------- 回到顶部 ---------- */
  .totop{
    position:fixed; right:max(20px, calc(50% - 634px)); bottom:26px; z-index:40;
    width:42px; height:42px; border-radius:12px;
    display:grid; place-items:center;
    font-size:17px; cursor:pointer;
    background:var(--card); color:var(--muted);
    border:1px solid var(--border-strong);
    box-shadow:var(--shadow);
    opacity:0; visibility:hidden; transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease, visibility .25s,
               color .18s ease, border-color .18s ease;
  }
  .totop.show{opacity:1; visibility:visible; transform:translateY(0);}
  .totop:hover{color:var(--accent); border-color:var(--accent); transform:translateY(-2px);}

  /* ---------- 季节特效层 ---------- */
  #fx{
    position:fixed; inset:0; z-index:1;
    width:100%; height:100%;
    pointer-events:none;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(7px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:720px){
    .top{padding:12px 16px 0; gap:10px;}
    .searchbar{padding:12px 16px 8px;}
    .wxbar{padding:0 16px 12px;}
    .cal-wrap{display:none;}
    main{padding:20px 16px 8px;}
    .stats{padding:16px;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="topwrap">
<header class="top">
  <div class="brand">
    <span class="mark">哇</span>
    <span class="brand-name">
      <b>哇啦咕</b>
      <span>Walagu Aoeu</span>
    </span>
  </div>
  <div class="actions">
    <span class="cal-wrap">
      <span class="clock" id="clock" title="点击查看日历"></span>
      <div class="cal-panel" id="calPanel" hidden></div>
    </span>
    <button class="btn icon" id="seasonBtn" title="季节特效"></button>
    <span class="ap-wrap">
      <button class="btn icon" id="themeBtn" title="外观配色">◐</button>
    </span>
  </div>
</header>

<div class="searchbar">
  <form class="search" id="searchForm" autocomplete="off">
    <div class="engines" id="engines"></div>
    <input id="search" type="text" placeholder="输入关键词，回车用引擎搜索" aria-label="搜索">
    <button type="submit" class="search-btn" id="searchGo">搜索</button>
  </form>
</div>
<div class="wxbar">
  <iframe id="weatherFrame" src="https://i.tianqi.com/index.php?c=code&id=40&color=%2377705f" scrolling="no" title="天气" loading="lazy"></iframe>
</div>
</div>

      var t = new Date();
      var isCurMonth = t.getFullYear() === viewY && t.getMonth() === viewM;

      /* 生成格子序列：上月补位 + 本月 + 下月补位（凑满整行） */
      var pm = viewM - 1, pmY = viewY; if(pm < 0){ pm = 11; pmY--; }
      var nm = viewM + 1, nmY = viewY; if(nm > 11){ nm = 0; nmY++; }
      var cells = [], i;
      for(i = 0; i < startWd; i++) cells.push({ n: prevDays - startWd + i + 1, cls: "dim", y: pmY, m: pm, d: prevDays - startWd + i + 1 });
      for(i = 1; i <= days; i++){
        var cls = (c => (c === 0 || c === 6) ? "we" : "")((i + startWd - 1) % 7);
        if(isCurMonth && i === t.getDate()) cls = "today";
        cells.push({ n: i, cls: cls, y: viewY, m: viewM, d: i });
      }
      while(cells.length % 7 !== 0){
        var nx = cells.length - startWd - days + 1;
        cells.push({ n: nx, cls: "dim", y: nmY, m: nm, d: nx });
      }

      var rows = "";
      for(i = 0; i < cells.length; i += 7){
        rows += "<tr>";
        for(var j = 0; j < 7; j++){
          var c = cells[i + j];
          rows += "<td class=\"" + c.cls + "\" data-y=\"" + c.y + "\" data-m=\"" + c.m + "\" data-d=\"" + c.d + "\"><span>" + c.n + "</span></td>";
        }
        rows += "</tr>";
      }

      var tlt = lunarText(t.getFullYear(), t.getMonth() + 1, t.getDate());
      panel.innerHTML =
        '<div class="cal-head">'
        + '<span class="cal-title">' + viewY + " 年 " + (viewM + 1) + " 月</span>"
        + '<span class="cal-nav">'
        + '<button type="button" data-nav="-1" title="上一月">‹</button>'
        + '<button type="button" data-nav="0" title="回到本月">今天</button>'
        + '<button type="button" data-nav="1" title="下一月">›</button>'
        + '</span></div>'
        + '<table class="cal"><thead><tr>'
        + '<th class="we">日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th class="we">六</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>'
        + '<div class="cal-foot"><span>' + (tlt ? tlt.mon + tlt.dat : "") + '</span>'
        + '<a class="cal-ext" href="https://www.baidu.com/s?wd=' + encodeURIComponent(viewY + "年" + (viewM + 1) + "月日历") + '" target="_blank" rel="noopener" title="在新标签页打开百度日历（节假日·宜忌）">百度日历 ↗</a></div>';
    }
    function open(){ panel.hidden = false; build(); }
    function close(){ panel.hidden = true; }
    clockEl.addEventListener("click", function(e){
      e.stopPropagation();
      panel.hidden ? open() : close();
    });
    panel.addEventListener("click", function(e){
      e.stopPropagation();
      var b = e.target.closest("button[data-nav]");
      if(b){
        var d = Number(b.dataset.nav);
        if(d === 0){ var t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth(); }
        else { viewM += d; if(viewM < 0){ viewM = 11; viewY--; } if(viewM > 11){ viewM = 0; viewY++; } }
        build();
        return;
      }
      var td = e.target.closest("td[data-y]");
      if(td){
        var q = td.dataset.y + "年" + (Number(td.dataset.m) + 1) + "月" + td.dataset.d + "日 黄历";
        window.open("https://www.baidu.com/s?wd=" + encodeURIComponent(q), "_blank", "noopener");
      }
    });
    document.addEventListener("click", close);
    document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });
  })();

  /* ---------- toast ---------- */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  /* ---------- 回到顶部 ---------- */
  (function(){
    var btn = document.getElementById("toTop");
    if(!btn) return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var shown = false;
    function toggle(){
      var want = (window.scrollY || document.documentElement.scrollTop) > 320;
      if(want !== shown){ shown = want; btn.classList.toggle("show", want); }
    }
    window.addEventListener("scroll", toggle, { passive: true });
    toggle();
    btn.addEventListener("click", function(){
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
  })();

  /* ---------- 四季特效 ---------- */
  (function(){
    var cvs = document.getElementById("fx");
    var btn = document.getElementById("seasonBtn");
    if(!cvs || !cvs.getContext) return;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      cvs.remove(); if(btn) btn.remove(); return;
    }
    var ctx = cvs.getContext("2d");
    var W = 0, H = 0, dpr = 1, parts = [], last = 0, raf = 0, S = null;
    var LS_SEASON = "nav.season";
    var MODES = ["auto","spring","summer","autumn","winter","off"];
    var ICON = { spring:"\u{1F338}", summer:"\u{1FAE7}", autumn:"\u{1F342}", winter:"❄" };
    var NAME = { "auto":"自动", spring:"春 · 花瓣", summer:"夏 · 气泡", autumn:"秋 · 落叶", winter:"冬 · 雪花", "off":"关闭" };
    var mode = load(LS_SEASON, "auto");
    if(MODES.indexOf(mode) === -1) mode = "auto";
    var baseR = 150, baseG = 165, baseB = 190;

    function dark(){ return document.documentElement.dataset.theme === "dark"; }
    function readColor(){
      var v = getComputedStyle(document.documentElement).getPropertyValue("--fx-rgb");
      var p = (v || "").split(",");
      if(p.length === 3){ var r = +p[0], g = +p[1], b = +p[2]; if(r === r && g === g && b === b){ baseR = r; baseG = g; baseB = b; } }
    }
    function baseCol(a){ return "rgba(" + baseR + "," + baseG + "," + baseB + "," + a + ")"; }
    function seasonNow(){
      var m = new Date().getMonth() + 1;
      if(m === 12 || m <= 2) return "winter";
      if(m <= 5) return "spring";
      if(m <= 8) return "summer";
      return "autumn";
    }
    function cur(){ return mode === "auto" ? seasonNow() : mode; }
    function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
    function dens(){ return Math.max(.5, Math.min(1.3, W / 1280)); }
    var PET_L = ["247,184,200","250,206,222","243,164,185","240,190,205"];
    var PET_D = ["233,164,183","242,197,211","219,140,161"];
    var LEAF_L = ["214,137,45","194,72,45","186,134,20","161,94,45","224,165,88"];
    var LEAF_D = ["196,124,44","172,72,52","168,124,38","146,90,52"];

    function size(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cvs.clientWidth; H = cvs.clientHeight;
      cvs.width = Math.round(W * dpr);
      cvs.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    /* 春 · 花瓣 */
    var spring = {
      n: function(){ return Math.round(58 * dens()); },
      spawn: function(any){ return {
        x: Math.random() * W, y: any ? Math.random() * H : -14,
        r: 5 + Math.random() * 7,
        vy: .5 + Math.random() * .75,
        sway: .5 + Math.random() * 1.1,
        ph: Math.random() * 6.283,
        spin: .008 + Math.random() * .02,
        tilt: Math.random() * 6.283,
        flip: (Math.random() >= .5 ? 1 : -1) * (.01 + Math.random() * .025),
        a: .5 + Math.random() * .4,
        col: pick(dark() ? PET_D : PET_L)
      }; },
      upd: function(f, st){
        f.ph += f.spin * st; f.tilt += f.flip * st;
        f.y += f.vy * st;
        f.x += Math.sin(f.ph * 1.4 + f.y * .012) * f.sway * st;
        if(f.y > H + 16 || f.x < -24 || f.x > W + 24) f.dead = 1;
      },
      drw: function(f){
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph);
        ctx.scale(Math.cos(f.tilt), 1);
        ctx.globalAlpha = f.a;
        ctx.fillStyle = "rgb(" + f.col + ")";
        ctx.beginPath();
        ctx.moveTo(0, -f.r);
        ctx.bezierCurveTo(f.r * .85, -f.r * .45, f.r * .72, f.r * .55, 0, f.r);
        ctx.bezierCurveTo(-f.r * .72, f.r * .55, -f.r * .85, -f.r * .45, 0, -f.r);
        ctx.fill();
        ctx.globalAlpha = f.a * .5;
        ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(0, -f.r * .5); ctx.lineTo(0, f.r * .55); ctx.stroke();
        ctx.restore();
      }
    };

    /* 夏 · 白天气泡 / 夜间萤火虫 */
    var summer = {
      night: false,
      n: function(){ return Math.round((this.night ? 46 : 34) * dens()); },
      spawn: function(any){
        if(this.night){
          return {
            x: Math.random() * W, y: Math.random() * H,
            r: 1.3 + Math.random() * 1.5,
            vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .35,
            ph: Math.random() * 6.283, wob: .4 + Math.random() * .8,
            a: .5 + Math.random() * .5
          };
        }
        return {
          x: Math.random() * W, y: any ? Math.random() * H : H + 18,
          r: 5 + Math.random() * 13,
          vy: .35 + Math.random() * .8,
          sway: .3 + Math.random() * .7,
          ph: Math.random() * 6.283,
          a: .3 + Math.random() * .35
        };
      },
      upd: function(f, st){
        f.ph += st * .03;
        if(this.night){
          f.x += (f.vx + Math.sin(f.ph * 2) * f.wob * .15) * st;
          f.y += (f.vy + Math.cos(f.ph * 1.7) * f.wob * .15) * st;
          if(f.x < -20 || f.x > W + 20 || f.y < -20 || f.y > H + 20) f.dead = 1;
        } else {
          f.y -= f.vy * st;
          f.x += Math.sin(f.ph + f.y * .01) * f.sway * .5 * st;
          if(f.y < -f.r - 14 || f.x < -24 || f.x > W + 24) f.dead = 1;
        }
      },
      drw: function(f){
        if(this.night){
          var g = (Math.sin(f.ph * 3) + 1) / 2; g *= g;
          ctx.save(); ctx.translate(f.x, f.y);
          ctx.globalAlpha = f.a * (.15 + .85 * g);
          var gr = ctx.createRadialGradient(0, 0, 0, 0, 0, f.r * 4.5);
          gr.addColorStop(0, "rgba(255,216,120,.85)");
          gr.addColorStop(1, "rgba(255,216,120,0)");
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.arc(0, 0, f.r * 4.5, 0, 6.283); ctx.fill();
          ctx.fillStyle = "rgba(255,240,180,.95)";
          ctx.beginPath(); ctx.arc(0, 0, f.r * .9, 0, 6.283); ctx.fill();
          ctx.restore();
          return;
        }
        ctx.save(); ctx.globalAlpha = f.a;
        ctx.strokeStyle = baseCol(.75); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.stroke();
        ctx.fillStyle = baseCol(.08); ctx.fill();
        ctx.globalAlpha = f.a * .9;
        ctx.strokeStyle = "rgba(255,255,255,.8)";
        ctx.beginPath(); ctx.arc(f.x - f.r * .3, f.y - f.r * .32, f.r * .3, 3.4, 5.2); ctx.stroke();
        ctx.restore();
      }
    };

    /* 秋 · 落叶 */
    var autumn = {
      n: function(){ return Math.round(46 * dens()); },
      spawn: function(any){ return {
        x: Math.random() * W, y: any ? Math.random() * H : -16,
        r: 6 + Math.random() * 8,
        vy: .6 + Math.random() * .9,
        sway: .7 + Math.random() * 1.3,
        ph: Math.random() * 6.283,
        spin: .01 + Math.random() * .03,
        tilt: Math.random() * 6.283,
        flip: (Math.random() >= .5 ? 1 : -1) * (.02 + Math.random() * .05),
        a: .55 + Math.random() * .4,
        col: pick(dark() ? LEAF_D : LEAF_L)
      }; },
      upd: function(f, st){
        f.ph += f.spin * st; f.tilt += f.flip * st;
        f.y += f.vy * st;
        f.x += Math.sin(f.ph * 1.2 + f.y * .01) * f.sway * st;
        if(f.y > H + 18 || f.x < -26 || f.x > W + 26) f.dead = 1;
      },
      drw: function(f){
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph);
        ctx.scale(Math.cos(f.tilt), 1);
        ctx.globalAlpha = f.a;
        ctx.fillStyle = "rgb(" + f.col + ")";
        ctx.beginPath();
        ctx.moveTo(0, -f.r);
        ctx.bezierCurveTo(f.r * .8, -f.r * .45, f.r * .7, f.r * .5, 0, f.r * .85);
        ctx.bezierCurveTo(-f.r * .7, f.r * .5, -f.r * .8, -f.r * .45, 0, -f.r);
        ctx.fill();
        ctx.globalAlpha = f.a * .7;
        ctx.strokeStyle = dark() ? "rgba(255,255,255,.3)" : "rgba(70,45,15,.45)";
        ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(0, -f.r * .8); ctx.lineTo(0, f.r * .85); ctx.stroke();
        ctx.restore();
      }
    };

    /* 冬 · 雪花 */
    var winter = {
      n: function(){ return Math.round(Math.min(170, Math.max(48, W / 9))); },
      spawn: function(any){ return {
        x: Math.random() * W, y: any ? Math.random() * H : -12,
        r: 1 + Math.random() * 2.8,
        vy: .28 + Math.random() * .85,
        drift: .25 + Math.random() * .85,
        ph: Math.random() * Math.PI * 2,
        spin: .006 + Math.random() * .02,
        a: .35 + Math.random() * .55
      }; },
      upd: function(f, st){
        f.ph += f.spin * st;
        f.y += f.vy * st;
        f.x += Math.sin(f.ph * .6 + f.y * .01) * f.drift * .5 * st;
        if(f.y - 8 > H || f.x < -20 || f.x > W + 20) f.dead = 1;
      },
      drw: function(f){
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ph);
        ctx.globalAlpha = f.a;
        if(f.r >= 2.1){
          ctx.strokeStyle = "rgb(" + baseR + "," + baseG + "," + baseB + ")";
          ctx.lineWidth = Math.max(.7, f.r * .38);
          ctx.lineCap = "round";
          var arm = f.r * 1.75;
          for(var k = 0; k < 3; k++){
            ctx.rotate(Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(-arm, 0); ctx.lineTo(arm, 0);
            var tick = arm * .42;
            for(var s = -1; s <= 1; s += 2){
              ctx.moveTo(s * arm * .55, 0); ctx.lineTo(s * arm * .55 + tick * .5, tick * .5);
              ctx.moveTo(s * arm * .55, 0); ctx.lineTo(s * arm * .55 - tick * .5, -tick * .5);
            }
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = "rgb(" + baseR + "," + baseG + "," + baseB + ")";
          ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 6.283); ctx.fill();
        }
        ctx.restore();
      }
    };
    var SEASONS = { spring: spring, summer: summer, autumn: autumn, winter: winter };

    function frame(ts){
      var dt = last ? Math.min(48, ts - last) : 16; last = ts;
      var st = dt / 16.67;
      ctx.clearRect(0, 0, W, H);
      for(var i = 0; i < parts.length; i++){
        var f = parts[i];
        S.upd(f, st);
        if(f.dead){ parts[i] = S.spawn(false); continue; }
        S.drw(f);
      }
      raf = requestAnimationFrame(frame);
    }
    function start(){ if(!raf){ last = 0; raf = requestAnimationFrame(frame); } }
    function stop(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } }

    function build(){
      S = SEASONS[cur()];
      summer.night = dark();
      parts = [];
      var n = S.n();
      for(var i = 0; i < n; i++) parts.push(S.spawn(true));
    }
    function apply(){
      readColor();
      if(mode === "off"){ stop(); parts = []; ctx.clearRect(0, 0, W, H); return; }
      build(); start();
    }
    function syncBtn(){
      var s = cur();
      btn.textContent = (mode === "off") ? "\u2298" : ICON[s];
      btn.title = "季节特效：" + NAME[mode]
        + (mode === "auto" ? " · 当前 " + NAME[s] : "")
        + "（点击切换：自动→春→夏→秋→冬→关）";
    }

    btn.addEventListener("click", function(){
      mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
      save(LS_SEASON, mode);
      apply(); syncBtn();
    });
    var rt;
    window.addEventListener("resize", function(){
      clearTimeout(rt);
      rt = setTimeout(function(){ size(); if(mode !== "off") build(); }, 180);
    });
    document.addEventListener("visibilitychange", function(){
      if(mode === "off") return;
      document.hidden ? stop() : start();
    });
    window.__fxTheme = function(){ readColor(); if(mode !== "off") build(); };

    size(); apply(); syncBtn();
  })();

  /* ---------- 友情链接（对应 index.html 底部，可自行添加） ---------- */
  var LS_FRIENDS = "nav.friends";
  var FRIENDS = load(LS_FRIENDS, []);
  function renderFriends(){
    var el = document.getElementById("flinks");
    if(!el) return;
    if(!FRIENDS.length){
      el.innerHTML = '<span class="none">暂无友情链接，可在脚本 FRIENDS 中添加，格式：[名称, 网址]</span>';
      return;
    }
    el.innerHTML = FRIENDS.map(function(f){
      return '<a href="' + esc(f[1]) + '" target="_blank" rel="noopener">' + esc(f[0]) + '</a>';
    }).join("");
  }

  renderEngines();
  render();
  renderFriends();
})();
</script>
</body>
</html>
