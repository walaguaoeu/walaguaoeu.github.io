const timeEl=document.getElementById('time');
function formatTime(){
  const n=new Date(),w=['日','一','二','三','四','五','六'];
  const p=x=>String(x).padStart(2,'0');
  return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())} 星期${w[n.getDay()]}`;
}
timeEl.innerText=formatTime();
setInterval(()=>timeEl.innerText=formatTime(),1000);
</script>

/* ===== 樱花飘落 ===== */
(function(){
  const cv=document.getElementById('sakura'),cx=cv.getContext('2d');
  let W,H,P=[];
  function r(){W=cv.width=innerWidth;H=cv.height=innerHeight;}r();addEventListener('resize',r);
  for(let i=0;i<36;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*6+4,
    vx:Math.random()*.8-.4,vy:Math.random()*.9+.5,rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,
    o:Math.random()*.45+.35,pink:Math.random()<.5});
  (function loop(){
    cx.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.y+=p.vy;p.x+=p.vx+Math.sin(p.y*.012)*.4;p.rot+=p.vr;
      if(p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.beginPath();cx.ellipse(0,0,p.r,p.r*.62,0,0,6.28);
      cx.fillStyle=p.pink?`rgba(255,158,199,${p.o})`:`rgba(255,205,225,${p.o})`;
      cx.fill();cx.restore();
    });
    requestAnimationFrame(loop);
  })();
})();
